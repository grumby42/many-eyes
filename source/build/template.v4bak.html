<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build-id" content="__BUILD__">
<meta name="generated-utc" content="__STAMP__">
<title>__TITLE__</title>
<style>
:root{
  --paper:#f5efe3; --paper2:#ece3d1; --card:#fbf7ef; --ink:#2b2420; --ink2:#5b4f45; --ink3:#857565;
  --rule:#d8ccb6; --accent:#8a2f1d; --accent2:#2f5d62; --gold:#9a7429; --shadow:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.06);
  --lane:#e7dcc8; --hl:#f3dfa8; --sea:#e6dccb; --land:#faf5ec;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --eyeL:40%; --eyeS:52%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1a17; --paper2:#26221e; --card:#24201c; --ink:#ece3d3; --ink2:#c3b6a3; --ink3:#968877;
    --rule:#3d362f; --accent:#e08a6d; --accent2:#7fb7bb; --gold:#d6b25e; --shadow:0 1px 2px rgba(0,0,0,.4);
    --lane:#2f2a25; --hl:#5a4a22; --eyeL:68%; --eyeS:55%; --sea:#171512; --land:#2c2722;
  }
}
:root[data-theme="dark"]{
  --paper:#1d1a17; --paper2:#26221e; --card:#24201c; --ink:#ece3d3; --ink2:#c3b6a3; --ink3:#968877;
  --rule:#3d362f; --accent:#e08a6d; --accent2:#7fb7bb; --gold:#d6b25e; --shadow:0 1px 2px rgba(0,0,0,.4);
  --lane:#2f2a25; --hl:#5a4a22; --eyeL:68%; --eyeS:55%; --sea:#171512; --land:#2c2722;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.62;-webkit-text-size-adjust:100%}
a{color:var(--accent2)}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit}
.sans{font-family:var(--sans)}
/* top bar */
#bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:14px}
#bar .brand{font-family:var(--serif);font-weight:700;letter-spacing:.04em;white-space:nowrap}
#bar .grow{flex:1}
#bar input{width:min(280px,40vw);padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
@media (max-width:560px){#bar .brand,#bar .grow{display:none}#bar input{flex:1;width:auto;min-width:0}}
.iconbtn{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.iconbtn:hover{border-color:var(--accent)}
/* layout */
#wrap{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1400px;margin:0 auto}
#toc{position:sticky;top:49px;align-self:start;height:calc(100vh - 49px);overflow:auto;padding:20px 14px 40px 20px;border-right:1px solid var(--rule);font-family:var(--sans);font-size:14px}
#toc h4{font-family:var(--serif);margin:.4em 0 .6em;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
#toc a{display:block;text-decoration:none;color:var(--ink2);padding:5px 8px;border-radius:5px;line-height:1.3}
#toc a:hover,#toc a.on{background:var(--paper2);color:var(--ink)}
#toc a .n{display:inline-block;min-width:2.2em;color:var(--gold);font-family:var(--serif)}
#toc a small{display:block;color:var(--ink3);margin-left:2.6em;font-size:12px}
main{padding:0 clamp(16px,4vw,56px) 80px;min-width:0}
.page{max-width:860px;margin:0 auto}
@media (max-width:900px){
  #wrap{grid-template-columns:1fr}
  #toc{position:fixed;left:0;top:49px;width:min(320px,86vw);z-index:50;background:var(--paper);transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  body.tocopen #toc{transform:none}
  body{font-size:17px}
}
@media (min-width:901px){#tocbtn{display:none}}
/* title page */
.titlepage{min-height:78vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 0;border-bottom:1px solid var(--rule)}
.titlepage h1{font-size:clamp(44px,8vw,86px);line-height:1;margin:.2em 0 .1em;letter-spacing:.02em;font-weight:600}
.titlepage .sub{font-size:clamp(18px,2.4vw,24px);color:var(--ink2);font-style:italic;max-width:640px}
.titlepage .orn{color:var(--gold);margin:22px 0}
.titlepage .meta{font-family:var(--sans);font-size:13px;color:var(--ink3);margin-top:26px}
/* prose */
h2.chap{font-size:clamp(34px,5vw,52px);line-height:1.08;margin:.15em 0 .1em;font-weight:600}
.chapnum{font-family:var(--sans);letter-spacing:.24em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.chapsub{font-style:italic;color:var(--ink2);font-size:20px;margin:0 0 6px}
h3{font-size:24px;margin:2.2em 0 .6em;font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:.25em}
h3 .h3n{font-family:var(--sans);font-size:12px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;margin-right:.6em}
.prose p{margin:0 0 1em;text-align:justify;hyphens:auto}
.prose p:first-child::first-letter{float:left;font-size:3.4em;line-height:.9;padding:.06em .08em 0 0;color:var(--accent);font-weight:600}
.note{background:var(--paper2);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 6px 6px 0;font-size:16px;margin:1.2em 0}
.note b{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px}
section.chapter{padding-top:56px;border-top:1px solid var(--rule);margin-top:56px}
.chaphead{display:grid;grid-template-columns:1fr 150px;gap:20px;align-items:center}
.chaphead svg{width:150px;height:150px}
@media (max-width:600px){.chaphead{grid-template-columns:1fr}.chaphead svg{width:96px;height:96px;order:-1}}
/* vantage ring */
.ringwrap{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:20px;align-items:start;margin:10px 0 18px}
@media (max-width:760px){.ringwrap{grid-template-columns:1fr}}
.ring svg{width:100%;height:auto;display:block}
.ring text{font-family:var(--sans)}
.ringkey{font-family:var(--sans);font-size:13px;color:var(--ink2)}
.ringkey ol{padding-left:1.4em;margin:.4em 0}
/* eye cards */
.eyes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.eye{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);font-size:15.5px;line-height:1.45;scroll-margin-top:70px}
.eye.flash{animation:flash 1.4s}
@keyframes flash{0%{background:var(--hl)}100%{background:var(--card)}}
.eye h5{margin:0;font-size:18px;line-height:1.2}
.eye .life{font-family:var(--sans);font-size:12px;color:var(--ink3)}
.eye .role{color:var(--ink2);font-style:italic;margin:4px 0}
.eye .row{font-family:var(--sans);font-size:12.5px;color:var(--ink2);margin:3px 0}
.eye .row b{color:var(--ink3);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.1em;margin-right:4px}
.eye details{margin-top:6px;font-size:14.5px}
.eye summary{cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--accent2)}
.eye .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.04em;padding:1px 7px;border-radius:20px;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);white-space:normal;max-width:100%;overflow-wrap:anywhere}
.badge.warn{border-color:var(--gold);color:var(--gold)}
.badge.v{background:var(--c);border-color:var(--c);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:12.5px;padding:3px 9px 3px 7px;border-radius:20px;border:1px solid var(--rule);background:var(--card);cursor:pointer;color:var(--ink);text-decoration:none;line-height:1.3}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.chip.off{opacity:.38}
.chip:hover{border-color:var(--c)}
/* swimlanes */
.lanes{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--card);margin:10px 0}
.lanes svg{display:block}
.lanes text{font-family:var(--sans)}
.lanes .tick{cursor:pointer}
.lanes .tick:hover{stroke:var(--ink);stroke-width:2}
/* convergences */
.conv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.cv{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:15.5px;line-height:1.45;box-shadow:var(--shadow)}
.cv .d{font-family:var(--sans);font-size:12px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.cv h6{font-size:17px;margin:2px 0 6px}
.cv .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
/* timeline */
.tl-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 14px;font-family:var(--sans);font-size:13px}
.tl-controls .lbl{color:var(--ink3);margin-right:4px}
.day{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px dashed var(--rule)}
.day.multi{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 10%,transparent),transparent 60%);border-radius:6px;padding-left:8px}
.day .when{font-family:var(--sans);font-size:13px;color:var(--ink2);position:sticky;top:60px;align-self:start}
.day .when b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.1}
.day .when .cnt{display:inline-block;margin-top:6px}
.day .stack{display:grid;gap:12px}
.day .stack,.day .when{min-width:0}
.day.multi .stack{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
@media (max-width:640px){.day{grid-template-columns:1fr;gap:6px}.day .when{position:static}.day .when b{display:inline;margin-right:8px}}
.entry{min-width:0;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:6px;padding:12px 14px;box-shadow:var(--shadow);scroll-margin-top:70px}
.entry.flash{animation:flash 1.6s}
.entry .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry .who a{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--c);text-decoration:none}
.entry .who .pl{font-family:var(--sans);font-size:12px;color:var(--ink3)}
.entry h6{font-size:18px;margin:4px 0 6px;line-height:1.25}
.entry p{margin:0 0 .5em;font-size:16.5px;line-height:1.55}
.entry blockquote{margin:.4em 0 .6em;padding:0 0 0 12px;border-left:2px solid var(--gold);font-style:italic;color:var(--ink2)}
.entry .foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-family:var(--sans);font-size:11.5px;color:var(--ink3)}
.entry .disp{font-family:var(--sans);font-size:12px;color:var(--ink3)}
/* threads, plates */
.threads{display:grid;gap:10px}
.thr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:16px}
.thr a.go{font-family:var(--sans);font-size:12.5px;text-decoration:none;border:1px solid var(--rule);border-radius:20px;padding:2px 10px;white-space:nowrap}
.thr .go.ext{font-family:var(--sans);font-size:12.5px;border:1px dashed var(--rule);border-radius:20px;padding:2px 10px;white-space:nowrap;color:var(--ink2)}
@media (max-width:640px){.thr{grid-template-columns:minmax(0,1fr)}.thr a.go,.thr .go,.thr .go.ext{white-space:normal;justify-self:start}}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:14px}
.plate{background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate .art{aspect-ratio:4/3;background:var(--paper2);display:block}
.plate .art svg{width:100%;height:100%;display:block}
.plate .cap{padding:10px 12px;font-size:14.5px;line-height:1.4;flex:1}
.plate .cap b{display:block;font-size:15.5px;margin-bottom:3px}
.plate .cap small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink3);margin-top:4px}
.plate a.view{display:block;text-align:center;font-family:var(--sans);font-size:13px;padding:8px;border-top:1px solid var(--rule);text-decoration:none}
figure.map,figure.fig{margin:14px 0 6px;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sea)}
figure.map svg,figure.fig svg{display:block;width:100%;height:auto}
figure.map svg text,figure.fig svg text{font-family:var(--sans);pointer-events:none}
.ring svg text{pointer-events:none}
figure.map figcaption,figure.fig figcaption{background:var(--card);border-top:1px solid var(--rule);padding:8px 12px;font-size:14.5px;line-height:1.45}
figure.fig figcaption b{display:block;font-size:16px}
.plate .art img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;background:var(--paper2)}
.plate.real .art{aspect-ratio:auto;height:260px;overflow:hidden}
#lightbox{position:fixed;inset:0;background:rgba(10,8,6,.9);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:96vw;max-height:84vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lightbox p{color:#eee;font-family:var(--sans);font-size:13.5px;max-width:900px;text-align:center;margin:12px 0 0}
.v2part{margin:30px 0 8px;font-family:var(--sans);letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.v2ch{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.v2ch h6{font-size:20px;margin:0}
.v2ch .sp{font-family:var(--sans);font-size:12.5px;color:var(--ink3);margin:2px 0 8px}
.v2ch ul{margin:.4em 0 .2em;padding-left:1.2em;font-size:15.5px}
.v2ch li{margin:.2em 0}
.v2ch .why{font-size:15.5px;color:var(--ink2);font-style:italic;margin-top:6px}
ul.further{padding-left:1.2em}
ul.further li{margin:.25em 0}
/* on this day */
#otd .otdbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--sans);font-size:14px;margin:10px 0}
#otd select{padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.otd-item{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-top:1px dashed var(--rule)}
.otd-item .y{font-size:26px;color:var(--gold);line-height:1}
.otd-item .y small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3);margin-top:4px}
/* index */
table.idx{width:100%;border-collapse:collapse;font-size:15px}
table.idx th,table.idx td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.idx th{font-family:var(--sans);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);cursor:pointer;position:sticky;top:49px;background:var(--paper)}
table.idx td .chip{font-size:12px}
.tablewrap{overflow-x:auto}
/* threads map */
#tmap svg{width:100%;height:auto;max-width:980px;display:block;margin:0 auto}
#tmap text{font-family:var(--sans)}
#tmap .node{cursor:pointer}
#tmap .edge{cursor:pointer}
#tmap .edge:hover{stroke:var(--accent);stroke-opacity:1}
#tmapnote{min-height:3em;font-size:16px;background:var(--paper2);padding:10px 14px;border-radius:6px;margin:10px 0}
/* search results */
#results{position:fixed;top:52px;right:12px;width:min(520px,94vw);max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:60;display:none;font-size:15px}
#results.on{display:block}
#results a{display:block;padding:9px 12px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
#results a:hover{background:var(--paper2)}
#results small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink3)}
mark{background:var(--hl);color:inherit;padding:0 1px}
.colophon{font-family:var(--sans);font-size:13px;color:var(--ink3);text-align:center;padding:40px 0 10px;border-top:1px solid var(--rule);margin-top:60px}
.colophon code{font-size:12.5px;color:var(--ink2)}
.hidden{display:none!important}
.backtop{font-family:var(--sans);font-size:12.5px;text-align:right;margin-top:24px}
@media print{
  #bar,#toc,.tl-controls,.lanes,#results,.backtop{display:none!important}
  #wrap{display:block} body{background:#fff;color:#000;font-size:11.5pt}
  section.chapter{break-before:page}
  .entry,.eye,.cv{box-shadow:none;break-inside:avoid}
  .day .when{position:static}
}
</style>

<body>
<div id="bar">
  <button class="iconbtn" id="tocbtn" aria-label="Contents">☰ Contents</button>
  <span class="brand">MANY EYES</span>
  <span class="grow"></span>
  <input id="q" type="search" placeholder="Search names, places, events…" aria-label="Search the book">
  <button class="iconbtn" id="theme" title="Toggle day / night reading">☾ Night</button>
</div>
<div id="results" role="listbox"></div>
<div id="lightbox" role="dialog" aria-label="Image viewer"><img alt=""><p></p></div>
<div id="wrap">
  <nav id="toc" aria-label="Table of contents"></nav>
  <main id="main"></main>
</div>
<script id="book-data" type="application/json">__DATA__</script>
<script>
"use strict";
const BOOK = JSON.parse(document.getElementById('book-data').textContent);
const BUILD = "__BUILD__", STAMP = "__STAMP__";
const META = Object.assign({ kicker: 'A synoptic reader', volume: '', sub: '', preface: '', outline_title: 'Volume II — in preparation' }, BOOK.meta || {});
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROMAN = (() => { const r = ['']; const v = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; for (let i = 1; i <= 60; i++) { let n = i, out = ''; for (const [k, sym] of v) while (n >= k) { out += sym; n -= k; } r.push(out); } return r; })();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const store = { get(k){ try{ return localStorage.getItem('manyeyes:'+k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem('manyeyes:'+k,v); }catch(e){} } };
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';

/* ---------- theme ---------- */
(function(){ const t = store.get('theme'); if (t) document.documentElement.dataset.theme = t; const dk = (t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'; $('#theme').textContent = dk ? '☀ Day' : '☾ Night'; })();
$('#theme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt; store.set('theme', nxt); $('#theme').textContent = nxt === 'dark' ? '☀ Day' : '☾ Night';
};
$('#tocbtn').onclick = () => document.body.classList.toggle('tocopen');

/* ---------- eye colours ---------- */
function eyeColor(i, n){ const h = Math.round((i * 137.508 + 12) % 360); return `hsl(${h} var(--eyeS) var(--eyeL))`; }
const EYES = {}; // key chap:eye -> {eye, chap, color}
BOOK.chapters.forEach(ch => {
  ch.eyes.forEach((e, i) => { EYES[ch.id + ':' + e.id] = { e, ch, color: eyeColor(i, ch.eyes.length) }; });
});
const eyeOf = (ch, id) => EYES[ch.id + ':' + id];
const chapById = id => BOOK.chapters.find(c => c.id === id);

/* ---------- date helpers ---------- */
function parseISO(s){ // supports negative / pre-1000 years loosely
  const m = /^(-?\d{1,4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(s || '');
  if (!m) return null;
  return { y: +m[1], m: m[2] ? +m[2] : null, d: m[3] ? +m[3] : null };
}

  'long-threads': `<rect x="48" y="30" width="54" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="48" y="104" width="54" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M56 46v58M94 46v58M56 54h38M56 62h38M56 70h38M56 78h38M56 86h38M56 94h38" stroke="currentColor" stroke-width="1.4"/><path d="M102 82c20 4 22 30 34 38" fill="none" stroke="currentColor" stroke-width="1.6"/>`
};
const emblem = id => `<svg viewBox="0 0 150 150" style="color:var(--gold)" aria-hidden="true"><circle cx="75" cy="75" r="72" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>${EMB[id] || EMB['long-threads']}</svg>`;

/* plate art: a framed engraving-like vignette made of the chapter emblem */
function plateArt(ch, i){
  return `<svg viewBox="0 0 160 120" aria-hidden="true"><rect x="6" y="6" width="148" height="108" fill="none" stroke="var(--rule)" stroke-width="2"/><rect x="12" y="12" width="136" height="96" fill="none" stroke="var(--rule)"/>
  <g transform="translate(50 30) scale(.4)" style="color:var(--ink3)">${EMB[ch.id] || ''}</g>
  <text x="80" y="102" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="var(--ink3)" letter-spacing="2">PLATE ${ROMAN[ch.n]}.${i+1}</text></svg>`;
}

/* ---------- vantage ring ---------- */
function ringSVG(ch){
  const W = 420, cx = 210, cy = 210, R = [34, 74, 114, 154, 194];
  const labels = ['centre', 'on the scene', 'near', 'same country', 'abroad'];
  let s = `<svg viewBox="0 0 ${W} 420" role="img" aria-label="Vantage ring for ${esc(ch.title)}">`;
  for (let k = 4; k >= 0; k--) s += `<circle cx="${cx}" cy="${cy}" r="${R[k]}" fill="${k===0?'var(--paper2)':'none'}" stroke="var(--rule)" stroke-dasharray="${k?'3 4':''}"/>`;
  for (let k = 0; k < 5; k++) s += `<text x="${cx}" y="${cy - R[k] + 13}" text-anchor="middle" font-size="9.5" fill="var(--ink3)" letter-spacing="1">${k}·${labels[k].toUpperCase()}</text>`;
  const byV = [[],[],[],[],[]];
  ch.eyes.forEach(e => { const v = Math.max(0, Math.min(4, +e.vantage || 0)); byV[v].push(e); });
  byV.forEach((arr, v) => {
    const rr = v === 0 ? 0 : (R[v] + R[v-1]) / 2 + 2;
    arr.forEach((e, j) => {
      const a = (-Math.PI/2) + (2*Math.PI) * (j + (v % 2 ? .5 : 0)) / Math.max(arr.length, 1) + .2;
      const r0 = v === 0 ? (arr.length > 1 ? 16 : 0) : rr + (arr.length > 6 ? (j % 2 ? 9 : -9) : 0);
      const x = cx + Math.cos(a) * r0, y = cy + Math.sin(a) * r0;
      const col = eyeOf(ch, e.id).color;
      const short = e.short || e.name;
      const lx = x + (Math.cos(a) >= 0 ? 9 : -9), anchor = Math.cos(a) >= 0 ? 'start' : 'end';
      s += `<g class="ringdot" data-eye="${esc(e.id)}" style="cursor:pointer"><title>${esc(e.name)} — ${esc(e.vantage_label || '')}</title>
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${col}" stroke="var(--card)" stroke-width="2"/>
      <text x="${lx.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="600" fill="${col}" paint-order="stroke" stroke="var(--paper)" stroke-width="3">${esc(short)}</text></g>`;
    });
  });
  return s + `</svg>`;
}

/* ---------- swimlanes ---------- */
function lanesSVG(ch){
  const ents = ch.entries.filter(e => dayNum(e.date_iso) != null);
  if (!ents.length) return '';
  const nums = ents.map(e => dayNum(e.date_iso));
  let lo = Math.min(...nums), hi = Math.max(...nums); if (hi === lo) hi = lo + 31;
  const L = 150, Wd = Math.max(820, Math.min(1500, ents.length * 18 + 200)), H = 26 * ch.eyes.length + 46;
  const X = n => L + (n - lo) / (hi - lo) * (Wd - L - 20);
  let s = `<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="When each diarist wrote">`;
  // year/month axis
  const p0 = parseISO(ents.reduce((a,b)=>dayNum(a.date_iso)<dayNum(b.date_iso)?a:b).date_iso), p1 = parseISO(ents.reduce((a,b)=>dayNum(a.date_iso)>dayNum(b.date_iso)?a:b).date_iso);
  const spanYears = p1.y - p0.y;
  if (spanYears >= 2){
    const step = spanYears > 40 ? 10 : spanYears > 12 ? 5 : 1;
    for (let y = Math.ceil(p0.y/step)*step; y <= p1.y; y += step){ const x = X(y*372); s += `<line x1="${x}" x2="${x}" y1="18" y2="${H-6}" stroke="var(--rule)"/><text x="${x+3}" y="13" font-size="10.5" fill="var(--ink3)">${yr(y)}</text>`; }
  } else {
    for (let y = p0.y; y <= p1.y; y++) for (let m = 0; m < 12; m++){ const n = y*372 + m*31; if (n < lo - 31 || n > hi) continue; const x = X(Math.max(n, lo)); s += `<line x1="${x}" x2="${x}" y1="18" y2="${H-6}" stroke="var(--rule)" stroke-dasharray="${m?'2 4':''}"/><text x="${x+3}" y="13" font-size="10.5" fill="var(--ink3)">${m===0||n<=lo?MONTHS[m].slice(0,3)+' '+yr(y):MONTHS[m].slice(0,3)}</text>`; }
  }
  ch.eyes.forEach((e, i) => {
    const y = 34 + i * 26, col = eyeOf(ch, e.id).color;
    s += `<rect x="${L}" y="${y-8}" width="${Wd-L-14}" height="16" rx="8" fill="var(--lane)" opacity=".55"/>`;
    s += `<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11.5" fill="${col}" font-weight="600">${esc(e.name.length > 22 ? (e.short || e.name) : e.name)}</text>`;
    ch.entries.forEach((en, k) => { if (en.eye !== e.id) return; const n = dayNum(en.date_iso); if (n == null) return; const x = X(n);
      s += `<line class="tick" data-entry="${ch.id}-${k}" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y-8}" y2="${y+8}" stroke="${col}" stroke-width="${en.precision==='day'?3:6}" stroke-linecap="round" opacity="${en.precision==='day'?1:.55}"><title>${esc(en.date_display)} — ${esc(en.headline)}</title></line>`; });
  });
  return s + `</svg>`;
}

/* ---------- renderers ---------- */
function eyeCard(ch, e){
  const ref = eyeOf(ch, e.id), n = ch.entries.filter(x => x.eye === e.id).length;
  const ties = (ch.ties || []).filter(t => t.a === e.id || t.b === e.id);
  const formWarn = /memoir|later|revised|chronicle|letter|press|reportage/i.test(e.form || '') ? ' warn' : '';
  const srcs = (e.sources || []).map(s => safeUrl(s.url) ? `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)} ↗</a></li>` : `<li>${esc(s.title)}</li>`).join('');
  const tieHTML = ties.map(t => { const o = eyeOf(ch, t.a === e.id ? t.b : t.a); if (!o) return ''; return `<li><a class="chip" style="--c:${o.color}" href="#eye-${ch.id}-${o.e.id}"><i></i>${esc(o.e.name)}</a> <span class="badge">${esc(t.kind)}</span> ${esc(t.note)}</li>`; }).join('');
  return `<article class="eye" id="eye-${ch.id}-${esc(e.id)}" style="--c:${ref.color}">
    <h5>${esc(e.name)}</h5><div class="life">${esc(e.life)} · ${esc(e.language || '')}</div>
    <div class="role">${esc(e.role)}</div>
    <div class="row"><b>Side</b>${esc(e.side)}</div>
    <div class="row"><b>Stood</b>${esc(e.where)}</div>
    <div class="row"><span class="badge v" style="--c:${ref.color}">vantage ${esc(e.vantage)}</span> <span class="badge">${esc(e.vantage_label || '')}</span> <span class="badge${formWarn}">${esc(e.form)}</span></div>
    <details><summary>Who, and how we know</summary><p>${esc(e.bio)}</p><p><em>Authenticity:</em> ${esc(e.authenticity)}</p>${srcs ? `<p><em>Read the original:</em></p><ul>${srcs}</ul>` : ''}</details>
    ${tieHTML ? `<details><summary>Ties to other eyes (${ties.length})</summary><ul>${tieHTML}</ul></details>` : ''}
    <div class="acts"><button class="chip" style="--c:${ref.color}" data-solo="${ch.id}|${esc(e.id)}"><i></i>Read only ${esc(e.short || e.name)} (${n})</button></div>
  </article>`;
}

function entryHTML(ch, en, k){
  const ref = eyeOf(ch, en.eye) || { color: 'var(--ink3)', e: { name: en.eye } };
  const conf = en.confidence === 'verified' ? '' : `<span class="badge warn" title="Exact date or wording could not be pinned down">approximate</span>`;
  return `<article class="entry" id="en-${ch.id}-${k}" data-eye="${esc(en.eye)}" style="--c:${ref.color}">
    <div class="who"><a href="#eye-${ch.id}-${esc(en.eye)}">${esc(ref.e.name)}</a><span class="pl">${esc(en.place)}</span></div>
    <div class="disp">${esc(en.date_display)}</div>
    <h6>${esc(en.headline)}</h6>
    <p>${esc(en.digest)}</p>
    ${en.quote ? `<blockquote>“${esc(en.quote)}”</blockquote>` : ''}
    <div class="foot">${conf}<span class="badge">digest</span><span>${esc(en.source_note || '')}</span></div>
  </article>`;
}

function timelineHTML(ch){
  const idx = ch.entries.map((e, k) => ({ e, k })).sort((a, b) => (dayNum(a.e.date_iso) ?? 0) - (dayNum(b.e.date_iso) ?? 0));
  const groups = []; let cur = null;
  idx.forEach(o => { const key = (o.e.date_iso || '').slice(0, o.e.precision === 'day' ? 10 : 7);
    if (!cur || cur.key !== key) { cur = { key, items: [] }; groups.push(cur); } cur.items.push(o); });
  return groups.map(g => {
    const eyesIn = new Set(g.items.map(o => o.e.eye));
    const multi = eyesIn.size > 1;
    return `<div class="day${multi ? ' multi' : ''}" data-eyes="${esc([...eyesIn].join(' '))}">
      <div class="when">${fmtKey(g.items[0].e.date_iso, g.items[0].e.precision)}${multi ? `<span class="badge cnt">${eyesIn.size} eyes</span>` : ''}</div>
      <div class="stack">${g.items.map(o => entryHTML(ch, o.e, o.k)).join('')}</div></div>`;
  }).join('');
}

function chapterHTML(ch){
  const intro = (ch.intro || []).map(p => `<p>${esc(p)}</p>`).join('');
  const conv = (ch.convergences || []).map(c => `<div class="cv"><div class="d">${prettyDate(c.date)}</div><h6>${esc(c.label)}</h6><div>${esc(c.note)}</div>
     <div class="chips">${(c.eyes || []).map(id => { const o = eyeOf(ch, id); return o ? `<a class="chip" style="--c:${o.color}" href="#eye-${ch.id}-${esc(id)}"><i></i>${esc(o.e.name)}</a>` : ''; }).join('')}</div>
     <div class="chips"><button class="chip" data-jump="${ch.id}|${esc(c.date)}">Read that day on the timeline ↓</button></div></div>`).join('');
  const thr = (ch.threads_out || []).map(t => { const to = chapById(t.to);
     const ext = !to && BOOK.external && BOOK.external[t.to];
     if (ext) return `<div class="thr"><span class="go ext">→ ${esc(ext.volume)}, ${esc(ext.num)}. ${esc(ext.title)}</span><div>${esc(t.note)}</div></div>`;
     if (!to) return '';
     return `<div class="thr"><a class="go" href="#ch-${to.id}">→ ${ROMAN[to.n]}. ${esc(stitle(to))}</a><div>${esc(t.note)}</div></div>`; }).join('');
  const inbound = [];
  BOOK.chapters.forEach(o => (o.threads_out || []).forEach(t => { if (t.to === ch.id && o.id !== ch.id) inbound.push({ o, t }); }));
  const inHTML = inbound.map(({o, t}) => `<div class="thr"><a class="go" href="#ch-${o.id}">← ${ROMAN[o.n]}. ${esc(stitle(o))}</a><div>${esc(t.note)}</div></div>`).join('');
  const figs = (ch.figures || []).map(f => `<figure class="fig">${f.svg}<figcaption><b>${esc(f.title)}</b>${esc(f.caption)}</figcaption></figure>`).join('');
  const plates = (ch.images || []).map((im, i) => `<figure class="plate${im.embed ? ' real' : ''}" style="margin:0"><span class="art">${im.embed ? `<img src="${im.embed}" alt="${esc(im.title)}" loading="lazy" data-cap="${esc(im.title + ' — ' + (im.caption || '') + ' ' + [im.date, im.credit].filter(Boolean).join(' · '))}">` : plateArt(ch, i)}</span>
     <figcaption class="cap"><b>${esc(im.title)}</b>${esc(im.caption)}<small>${esc([im.date, im.credit].filter(Boolean).join(' · '))}</small></figcaption>
     ${safeUrl(im.url) ? `<a class="view" href="${esc(im.url)}" target="_blank" rel="noopener">View the original ↗</a>` : ''}</figure>`).join('');
  const further = (ch.further || []).map(f => safeUrl(f.url) ? `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)} ↗</a></li>` : `<li>${esc(f.title)}</li>`).join('');
  const eyeChips = ch.eyes.map(e => { const o = eyeOf(ch, e.id); return `<button class="chip" style="--c:${o.color}" data-toggle="${ch.id}|${esc(e.id)}"><i></i>${esc(e.name)}</button>`; }).join('');
  return `<section class="chapter page" id="ch-${ch.id}" data-ch="${ch.id}">
    <div class="chaphead"><div><div class="chapnum">Chapter ${ROMAN[ch.n]} · ${esc(ch.span)}</div><h2 class="chap">${esc(ch.title)}</h2><p class="chapsub">${esc(ch.subtitle)}</p>
      <div class="sans" style="font-size:13px;color:var(--ink3)">${ch.eyes.length} eyes · ${ch.entries.length} dated entries · ${(ch.convergences||[]).length} convergences</div></div>${emblem(ch.id)}</div>
    <div class="prose">${intro}</div>
    ${ch.calendar_note ? `<div class="note"><b>A note on the calendar</b>${esc(ch.calendar_note)}</div>` : ''}
    <h3><span class="h3n">${ROMAN[ch.n]}.1</span>The eyes</h3>
    <div class="ringwrap"><div class="ring">${ringSVG(ch)}</div><div class="ringkey"><p>${esc(ch.vantage_key || 'Distance from the event: 0 at the centre, 4 abroad.')}</p>
      <p>Each dot is a diarist, placed by how close they stood to the heart of events. Click a dot to open their card.</p>
      <ol start="0"><li>At the centre — a principal actor or direct victim</li><li>On the scene — eyewitness</li><li>Nearby — same city, near the front</li><li>Same country, at a distance</li><li>Abroad, or by news only</li></ol></div></div>
    ${ch.map_svg ? `<figure class="map">${ch.map_svg}<figcaption>Where each of them stood. Click a dot to open that diarist's card; dashed lines trace the journeys some of them made.</figcaption></figure>` : ''}
    <div class="eyes">${ch.eyes.map(e => eyeCard(ch, e)).join('')}</div>
    <h3><span class="h3n">${ROMAN[ch.n]}.2</span>When each of them wrote</h3>
    <p class="sans" style="font-size:13px;color:var(--ink3)">One lane per diarist; each mark is an entry (thick, faded marks are month- or range-level dates). Click a mark to jump to it. Scroll sideways on small screens.</p>
    <div class="lanes">${lanesSVG(ch)}</div>
    ${conv ? `<h3><span class="h3n">${ROMAN[ch.n]}.3</span>Where the eyes converge</h3><div class="conv">${conv}</div>` : ''}
    <h3><span class="h3n">${ROMAN[ch.n]}.4</span>The timeline</h3>
    <div class="tl-controls"><span class="lbl">Show:</span>${eyeChips}<button class="iconbtn" data-all="${ch.id}">All</button><button class="iconbtn" data-multi="${ch.id}">Only shared days</button></div>
    <div class="timeline" id="tl-${ch.id}">${timelineHTML(ch)}</div>
    ${(plates || figs) ? `<h3><span class="h3n">${ROMAN[ch.n]}.5</span>Plates &amp; figures</h3>${figs}${plates ? `<p class="sans" style="font-size:13px;color:var(--ink3)">Period images. Pictures shown here are embedded public-domain copies (tap to enlarge); framed placeholders mark images held by museums and archives that you can open online.</p><div class="plates">${plates}</div>` : ''}` : ''}
    ${(thr || inHTML) ? `<h3><span class="h3n">${ROMAN[ch.n]}.6</span>Threads to other chapters</h3><div class="threads">${thr}${inHTML}</div>` : ''}
    ${further ? `<h3><span class="h3n">${ROMAN[ch.n]}.7</span>Further reading</h3><ul class="further">${further}</ul>` : ''}
    <div class="backtop"><a href="#top">↑ Contents</a></div>
  </section>`;
}

/* ---------- front & back matter ---------- */
function frontHTML(){
  const nE = Object.keys(EYES).length, nEn = BOOK.chapters.reduce((a, c) => a + c.entries.length, 0);
  return `<section class="page titlepage" id="top"><div class="chapnum">${esc(META.kicker)}</div><h1>Many Eyes</h1>${META.volume ? `<div class="chapnum" style="font-size:16px;margin-top:6px">${esc(META.volume)}</div>` : ''}
    <div class="sub">${esc(META.sub)}</div>
    <div class="orn"><svg width="180" height="20" viewBox="0 0 180 20"><path d="M0 10h70M110 10h70" stroke="currentColor"/><circle cx="90" cy="10" r="6" fill="none" stroke="currentColor"/><circle cx="90" cy="10" r="2" fill="currentColor"/></svg></div>
    <div class="sans" style="color:var(--ink2)">${BOOK.chapters.length} chapters · ${nE} diarists · ${nEn} dated entries</div>
    <div class="meta">Build <code>${esc(BUILD)}</code> · generated ${esc(STAMP)} UTC</div></section>
  <section class="page" id="preface" style="padding-top:48px"><div class="chapnum">Before you begin</div><h2 class="chap" style="font-size:38px">How to read this book</h2>
   <div class="prose"><p>${esc(META.preface)}</p>
   <p>The rule throughout is authenticity. Every voice here is a real person whose diary, journal, notebook, log or dated letters survive. Where a famous text is really a memoir written later, a revised diary, a chronicle or a set of letters, the eye card says so with an amber tag. Forgeries and fictions are named only to warn you off them.</p>
   <p>The entries are digests: paraphrases in this book's words of what each diarist recorded, sometimes with a short phrase in their own. They are a map, not a substitute. Each eye card links to editions and archives where you can read the diarist's own words, and the plates link to period images held by museums and libraries. Dates marked <span class="badge warn">approximate</span> could only be fixed to a month or range. Treat this as a well-sourced guide, and check the originals before you quote anything.</p></div>
   <div class="note"><b>Reading tools</b>The <em>vantage ring</em> in each chapter shows how close each diarist stood to the centre of events, and the <em>map</em> beneath it shows where on earth they were. The <em>lanes</em> show when each one was writing. <em>Convergences</em> collect the days that several eyes recorded. Filter any timeline by diarist, or show only shared days. At the back, <a href="#otd">On this day</a> pulls every entry with the same calendar date from across all ${BOOK.chapters.length} chapters, <a href="#tmap">The web of threads</a> maps the links between chapters, and the <a href="#idx">Index of eyes</a> lists everyone.</div></section>`;
}

function otdHTML(){
  const opts = MONTHS.map((m, i) => `<option value="${i+1}">${m}</option>`).join('');
  return `<section class="page chapter" id="otd"><div class="chapnum">Back matter</div><h2 class="chap">On this day, across history</h2>
   <p class="chapsub">Every entry in the book written on the same calendar day, in any year</p>
   <div class="otdbar"><label>Month <select id="otdm">${opts}</select></label><label>Day <select id="otdd"></select></label><button class="iconbtn" id="otdtoday">Today</button><button class="iconbtn" id="otdnext">Next day with entries →</button></div>
   <p class="sans" style="font-size:12.5px;color:var(--ink3)">Dates are matched as given in each chapter's timeline (New Style / Gregorian where the chapter converts them). Only day-level entries are included.</p>
   <div id="otdlist"></div></section>`;
}
function vol2HTML(){
  const v = BOOK.volume2; if (!v) return '';
  return `<section class="page chapter" id="vol2"><div class="chapnum">Back matter</div><h2 class="chap">${esc(META.outline_title)}</h2><p class="chapsub">${esc(v.subtitle || '')}</p>
   <div class="prose">${(v.intro || []).map(p => `<p>${esc(p)}</p>`).join('')}</div>
   ${(v.parts || []).map(pt => `<div class="v2part">${esc(pt.title)}</div>${(pt.chapters || []).map((c, i) => `<div class="v2ch"><h6>${esc(c.title)}</h6><div class="sp">${esc(c.span)}${c.status ? ' · ' + esc(c.status) : ''}</div><div>${esc(c.premise)}</div><ul>${(c.eyes || []).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${c.caution ? `<div class="why">${esc(c.caution)}</div>` : ''}</div>`).join('')}`).join('')}
  </section>`;
}
function tmapHTML(){ return `<section class="page chapter" id="tmap"><div class="chapnum">Back matter</div><h2 class="chap">The web of threads</h2><p class="chapsub">Real links running between the chapters — people, places, consequences, ideas</p><div id="tmapsvg"></div><div id="tmapnote" class="sans">Hover or tap a line to read the link; tap a chapter to go there.</div></section>`; }
function idxHTML(){
  const rows = [];
  BOOK.chapters.forEach(ch => ch.eyes.forEach(e => { const o = eyeOf(ch, e.id); rows.push({ ch, e, o, n: ch.entries.filter(x => x.eye === e.id).length }); }));
  rows.sort((a, b) => a.e.name.split(' ').slice(-1)[0].localeCompare(b.e.name.split(' ').slice(-1)[0]));
  return `<section class="page chapter" id="idx"><div class="chapnum">Back matter</div><h2 class="chap">Index of eyes</h2><p class="chapsub">${rows.length} diarists, letter-writers and chroniclers</p>
   <div class="tablewrap"><table class="idx"><thead><tr><th>Name</th><th>Chapter</th><th>Role</th><th>Vantage</th><th>Form</th><th>Entries</th></tr></thead><tbody>
   ${rows.map(r => `<tr><td><a class="chip" style="--c:${r.o.color}" href="#eye-${r.ch.id}-${esc(r.e.id)}"><i></i>${esc(r.e.name)}</a><div class="sans" style="font-size:11.5px;color:var(--ink3)">${esc(r.e.life)}</div></td><td><a href="#ch-${r.ch.id}">${ROMAN[r.ch.n]}. ${esc(r.ch.title)}</a></td><td>${esc(r.e.role)}</td><td>${esc(r.e.vantage)} · ${esc(r.e.vantage_label || '')}</td><td>${esc(r.e.form)}</td><td>${r.n}</td></tr>`).join('')}
   </tbody></table></div></section>`;
}
function colophonHTML(){ return `<div class="colophon page">Many Eyes · build <code>${esc(BUILD)}</code> · generated <code>${esc(STAMP)}</code> UTC · one self-contained offline file; external links open the original sources when you are online.<br>Digests are paraphrases. Verify against the originals before quoting.</div>`; }

/* ---------- assemble ---------- */
BOOK.chapters.forEach((c, i) => c.n = i + 1);
$('#main').innerHTML = frontHTML() + BOOK.chapters.map(chapterHTML).join('') + otdHTML() + tmapHTML() + idxHTML() + vol2HTML() + colophonHTML();
$('#toc').innerHTML = `<h4>Contents</h4><a href="#preface"><span class="n">·</span>How to read this book</a>` +
  BOOK.chapters.map(c => `<a href="#ch-${c.id}" data-ch="${c.id}"><span class="n">${ROMAN[c.n]}</span>${esc(c.short_title && c.title.length > 34 ? c.short_title : c.title)}<small>${esc(c.span)} · ${c.eyes.length} eyes</small></a>`).join('') +
  `<h4 style="margin-top:18px">Back matter</h4><a href="#otd"><span class="n">·</span>On this day</a><a href="#tmap"><span class="n">·</span>The web of threads</a><a href="#idx"><span class="n">·</span>Index of eyes</a>` + (BOOK.volume2 ? `<a href="#vol2"><span class="n">·</span>${esc(META.outline_title)}</a>` : '');
$$('#toc a').forEach(a => a.addEventListener('click', () => document.body.classList.remove('tocopen')));

/* ---------- interactions ---------- */
function flash(el){ if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function goTo(id){ const el = document.getElementById(id); if (!el) return; showAllAround(el); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); flash(el); }
function showAllAround(el){ const day = el.closest('.day'); if (day) day.classList.remove('hidden'); const en = el.closest('.entry'); if (en) en.classList.remove('hidden'); }
document.addEventListener('click', ev => {
  const im = ev.target.closest('.plate .art img');
  if (im) { const lb = $('#lightbox'); $('img', lb).src = im.src; $('p', lb).textContent = im.dataset.cap || ''; lb.classList.add('on'); return; }
  if (ev.target.closest('#lightbox')) { $('#lightbox').classList.remove('on'); return; }
  const md = ev.target.closest('.mapdot');
  if (md) { const ch = md.closest('section.chapter').dataset.ch; goTo(`eye-${ch}-${md.dataset.eye}`); return; }
  const t = ev.target.closest('[data-solo],[data-toggle],[data-all],[data-multi],[data-jump],.ringdot,.tick');
  if (!t) return;
  if (t.classList.contains('ringdot')) { const ch = t.closest('section.chapter').dataset.ch; goTo(`eye-${ch}-${t.dataset.eye}`); return; }
  if (t.classList.contains('tick')) { goTo('en-' + t.dataset.entry); return; }
  if (t.dataset.solo) { const [ch, id] = t.dataset.solo.split('|'); setFilter(ch, new Set([id]), false); $(`#tl-${ch}`).scrollIntoView({ behavior: 'smooth' }); return; }
  if (t.dataset.toggle) { const [ch, id] = t.dataset.toggle.split('|'); const st = filt(ch); if (st.on.has(id)) st.on.delete(id); else st.on.add(id); if (!st.on.size) allOn(ch, st); apply(ch); return; }
  if (t.dataset.all) { const st = filt(t.dataset.all); allOn(t.dataset.all, st); st.multi = false; apply(t.dataset.all); return; }
  if (t.dataset.multi) { const st = filt(t.dataset.multi); st.multi = !st.multi; apply(t.dataset.multi); return; }
  if (t.dataset.jump) { const [ch, d] = t.dataset.jump.split('|'); const st = filt(ch); allOn(ch, st); st.multi = false; apply(ch);
    const c = chapById(ch); const target = dayNum(d); let best = null, bd = 1e12;
    c.entries.forEach((e, k) => { const dd = Math.abs((dayNum(e.date_iso) ?? 1e12) - target); if (dd < bd) { bd = dd; best = k; } });
    if (best != null) goTo(`en-${ch}-${best}`); }
});
const FILT = {};
function filt(ch){ if (!FILT[ch]) { FILT[ch] = { on: new Set(), multi: false }; allOn(ch, FILT[ch]); } return FILT[ch]; }
function allOn(ch, st){ st.on = new Set(chapById(ch).eyes.map(e => e.id)); }
function setFilter(ch, set, multi){ const st = filt(ch); st.on = set; st.multi = multi; apply(ch); }
function apply(ch){
  const st = filt(ch), tl = $(`#tl-${ch}`);
  $$('.entry', tl).forEach(en => en.classList.toggle('hidden', !st.on.has(en.dataset.eye)));
  $$('.day', tl).forEach(d => { const vis = $$('.entry:not(.hidden)', d).length; const multi = d.classList.contains('multi');
    d.classList.toggle('hidden', vis === 0 || (st.multi && !multi)); });
  $$(`[data-toggle^="${ch}|"]`).forEach(b => b.classList.toggle('off', !st.on.has(b.dataset.toggle.split('|')[1])));
  const mb = $(`[data-multi="${ch}"]`); if (mb) mb.style.borderColor = st.multi ? 'var(--accent)' : '';
}

/* ---------- on this day ---------- */
const DAYIDX = {}; // "MM-DD" -> [{ch,k,en,y}]
BOOK.chapters.forEach(ch => ch.entries.forEach((en, k) => { if (en.precision !== 'day') return; const p = parseISO(en.date_iso); if (!p || !p.m || !p.d) return;
  const key = String(p.m).padStart(2,'0') + '-' + String(p.d).padStart(2,'0'); (DAYIDX[key] = DAYIDX[key] || []).push({ ch, k, en, y: p.y }); }));
function fillDays(){ const m = +$('#otdm').value; const dim = [31,29,31,30,31,30,31,31,30,31,30,31][m-1]; const cur = +$('#otdd').value || 1;
  $('#otdd').innerHTML = Array.from({ length: dim }, (_, i) => { const key = String(m).padStart(2,'0') + '-' + String(i+1).padStart(2,'0'); const n = (DAYIDX[key] || []).length; return `<option value="${i+1}">${i+1}${n ? ' • ' + n : ''}</option>`; }).join('');
  $('#otdd').value = Math.min(cur, dim); }
function renderOTD(){ const m = +$('#otdm').value, d = +$('#otdd').value; const key = String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  const items = (DAYIDX[key] || []).slice().sort((a, b) => a.y - b.y);
  $('#otdlist').innerHTML = items.length ? items.map(o => { const r = eyeOf(o.ch, o.en.eye) || { color: 'var(--ink3)', e: { name: o.en.eye } };
    return `<div class="otd-item"><div class="y">${yr(o.y)}<small>${ROMAN[o.ch.n]}. ${esc(o.ch.title)}</small></div><div class="entry" style="--c:${r.color}"><div class="who"><a href="#eye-${o.ch.id}-${esc(o.en.eye)}">${esc(r.e.name)}</a><span class="pl">${esc(o.en.place)}</span></div><div class="disp">${esc(o.en.date_display)}</div><h6>${esc(o.en.headline)}</h6><p>${esc(o.en.digest)}</p><div class="foot"><a href="#en-${o.ch.id}-${o.k}" data-otdgo="1">Read it in its chapter →</a></div></div></div>`; }).join('')
    : `<p class="sans" style="color:var(--ink3)">No day-level entries fall on ${d} ${MONTHS[m-1]}. Try “Next day with entries”.</p>`; }
$('#otdm').onchange = () => { fillDays(); renderOTD(); };
$('#otdd').onchange = renderOTD;
$('#otdtoday').onclick = () => { const t = new Date(); $('#otdm').value = t.getMonth() + 1; fillDays(); $('#otdd').value = t.getDate(); renderOTD(); };
$('#otdnext').onclick = () => { let m = +$('#otdm').value, d = +$('#otdd').value;
  for (let i = 0; i < 366; i++) { d++; const dim = [31,29,31,30,31,30,31,31,30,31,30,31][m-1]; if (d > dim) { d = 1; m = m % 12 + 1; }
    const key = String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); if (DAYIDX[key]) { $('#otdm').value = m; fillDays(); $('#otdd').value = d; renderOTD(); return; } } };
document.addEventListener('click', ev => { const a = ev.target.closest('[data-otdgo]'); if (!a) return; ev.preventDefault(); goTo(a.getAttribute('href').slice(1)); });
$('#otdtoday').click();

/* ---------- threads map ---------- */
(function(){
  const n = BOOK.chapters.length, W = 980, H = 640, cx = W/2, cy = H/2 + 6, R = 238;
  const pos = BOOK.chapters.map((c, i) => { const a = -Math.PI/2 + 2*Math.PI*i/n; return { c, x: cx + Math.cos(a)*R, y: cy + Math.sin(a)*R, a }; });
  const P = id => pos.find(p => p.c.id === id);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Links between chapters">`;
  const edges = [];
  BOOK.chapters.forEach(c => (c.threads_out || []).forEach(t => { const a = P(c.id), b = P(t.to); if (a && b && a !== b) edges.push({ a, b, t, from: c }); }));
  edges.forEach((e, i) => { const mx = (e.a.x + e.b.x)/2, my = (e.a.y + e.b.y)/2; const qx = cx + (mx - cx)*.35, qy = cy + (my - cy)*.35;
    s += `<path class="edge" data-i="${i}" d="M${e.a.x.toFixed(1)} ${e.a.y.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${e.b.x.toFixed(1)} ${e.b.y.toFixed(1)}" fill="none" stroke="var(--accent2)" stroke-opacity=".35" stroke-width="6"/>`; });
  pos.forEach(p => { const lx = p.x + Math.cos(p.a)*22, ly = p.y + Math.sin(p.a)*22 + 4; const anchor = Math.abs(Math.cos(p.a)) < .2 ? 'middle' : Math.cos(p.a) > 0 ? 'start' : 'end';
    s += `<g class="node" data-ch="${p.c.id}"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="15" fill="var(--card)" stroke="var(--gold)" stroke-width="2"/><text x="${p.x.toFixed(1)}" y="${(p.y+4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--gold)" font-family="Georgia,serif">${ROMAN[p.c.n]}</text>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="12.5" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="3">${esc(p.c.title.length > 30 ? p.c.title.slice(0, 29) + '…' : p.c.title)}</text>
      <text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--ink3)">${esc(p.c.span)}</text></g>`; });
  $('#tmapsvg').innerHTML = s + `</svg>`;
  const note = $('#tmapnote');
  const show = e => { note.innerHTML = `<b>${ROMAN[e.from.n]}. ${esc(e.from.title)} → ${ROMAN[e.b.c.n]}. ${esc(e.b.c.title)}</b><br>${esc(e.t.note)} <a href="#ch-${e.b.c.id}">Go →</a>`; };
  $$('#tmapsvg .edge').forEach(el => { el.addEventListener('mouseenter', () => show(edges[+el.dataset.i])); el.addEventListener('click', () => show(edges[+el.dataset.i])); });
  $$('#tmapsvg .node').forEach(el => el.addEventListener('click', () => goTo('ch-' + el.dataset.ch)));
})();

/* ---------- index sort ---------- */
$$('table.idx th').forEach((th, ci) => th.addEventListener('click', () => { const tb = th.closest('table').tBodies[0]; const rows = Array.from(tb.rows); const dir = th.dataset.dir === 'a' ? -1 : 1; th.dataset.dir = dir === 1 ? 'a' : 'd';
  rows.sort((a, b) => { const x = a.cells[ci].innerText.trim(), y = b.cells[ci].innerText.trim(); const nx = parseFloat(x), ny = parseFloat(y); return (!isNaN(nx) && !isNaN(ny) ? nx - ny : x.localeCompare(y)) * dir; });
  rows.forEach(r => tb.appendChild(r)); }));

/* ---------- search ---------- */
const SIDX = [];
BOOK.chapters.forEach(ch => {
  ch.eyes.forEach(e => SIDX.push({ id: `eye-${ch.id}-${e.id}`, title: e.name, sub: `${ROMAN[ch.n]}. ${ch.title} · ${e.role}`, text: [e.name, e.role, e.side, e.where, e.bio].join(' ') }));
  ch.entries.forEach((en, k) => { const o = eyeOf(ch, en.eye); SIDX.push({ id: `en-${ch.id}-${k}`, title: en.headline, sub: `${o ? o.e.name : en.eye} · ${en.date_display} · ${ROMAN[ch.n]}`, text: [en.headline, en.digest, en.place, en.date_display, o ? o.e.name : ''].join(' ') }); });
});
let qt; $('#q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(runSearch, 120); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#q').value = ''; runSearch(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('on'); });
function runSearch(){ const q = $('#q').value.trim().toLowerCase(); const box = $('#results');
  if (q.length < 2) { box.classList.remove('on'); return; }
  const terms = q.split(/\s+/); const hits = SIDX.filter(x => { const t = x.text.toLowerCase(); return terms.every(w => t.includes(w)); }).slice(0, 60);
  const hl = s => { let h = esc(s); terms.forEach(w => { if (w.length > 1) h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); }); return h; };
  box.innerHTML = hits.length ? hits.map(h => `<a href="#${h.id}" data-go="${h.id}">${hl(h.title)}<small>${esc(h.sub)}</small></a>`).join('') : `<a>No matches</a>`;
  box.classList.add('on'); }
$('#results').addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (!a) return; e.preventDefault(); $('#results').classList.remove('on'); goTo(a.dataset.go); });
document.addEventListener('click', e => { if (!e.target.closest('#results,#q')) $('#results').classList.remove('on'); });

/* ---------- toc highlight & resume ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { const id = e.target.dataset.ch; $$('#toc a').forEach(a => a.classList.toggle('on', a.dataset.ch === id)); store.set('last', id); } }), { rootMargin: '-40% 0px -55% 0px' });
$$('section.chapter[data-ch]').forEach(s => io.observe(s));
</script>
</body>
</html>
